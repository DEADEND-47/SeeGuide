<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="SeeGuide - Privacy-first phone-camera assistant for blind and low-vision pedestrians">
  <title>SeeGuide Assistant</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header role="banner">
    <h1>SeeGuide</h1>
    <div id="connection-status" class="status-badge disconnected" role="status" aria-live="polite">
      Connecting to server...
    </div>
  </header>

  <main id="main-content" role="main">

    <!-- Active Agent Speech & Auditory Feedback Region -->
    <section class="feedback-container" id="feedback-panel" aria-labelledby="feedback-heading">
      <h2 id="feedback-heading" class="feedback-label">Agent Feedback</h2>
      <!-- High-priority hazard alert region for immediate assistive tech announcement -->
      <div id="hazard-alert" role="alert" aria-live="assertive" class="sr-only"></div>
      <div id="status-text" class="feedback-text" role="status" aria-live="polite">
        Ready. Starting camera...
      </div>
    </section>

    <!-- Camera Control Bar -->
    <div class="camera-control-bar">
      <button id="btn-camera-toggle" class="btn-camera" aria-label="Stop camera stream">
        Stop Camera
      </button>
    </div>

    <!-- Human-in-the-Loop Confirmation Dialog (Hidden until triggered) -->
    <div id="confirmation-dialog" class="confirmation-dialog" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="confirm-prompt" aria-describedby="confirm-desc">
      <div id="confirm-prompt" class="confirmation-prompt">Confirmation required</div>
      <p id="confirm-desc" class="sr-only">Choose Yes to proceed with spoken text, or No to dismiss.</p>
      <div class="confirmation-actions">
        <button id="btn-confirm-yes" class="btn-confirm btn-yes" aria-label="Confirm yes">Yes</button>
        <button id="btn-confirm-no" class="btn-confirm btn-no" aria-label="Confirm no">No</button>
      </div>
    </div>

    <!-- Primary Operating Modes -->
    <section class="modes-grid" role="region" aria-label="Operating Modes">
      <button id="btn-mode-walk" class="btn-mode active" aria-pressed="true">
        Walk Mode (Hazards)
      </button>

      <button id="btn-mode-read" class="btn-mode" aria-pressed="false">
        Read Mode (Text & Signs)
      </button>

      <button id="btn-mode-describe" class="btn-mode describe" aria-label="Describe current scene on demand">
        Describe Scene
      </button>
    </section>

    <!-- Hidden Video & Canvas for Capture -->
    <div class="sr-only" aria-hidden="true">
      <video id="camera-feed" playsinline autoplay muted width="640" height="480"></video>
      <canvas id="capture-canvas" width="640" height="480"></canvas>
    </div>

    <!-- Controls & Demo Evaluation Mode -->
    <footer class="bottom-controls" role="contentinfo">
      <div class="demo-toggle-container">
        <label for="demo-switch" id="demo-label">Demo Video Mode</label>
        <label class="switch">
          <input type="checkbox" id="demo-switch" aria-labelledby="demo-label">
          <span class="slider"></span>
        </label>
      </div>

      <div id="demo-upload-wrapper" style="display: none;">
        <input type="file" id="video-file-input" accept="video/*" class="sr-only" aria-label="Select evaluation video file">
        <button id="btn-select-video" class="btn-upload" style="width: 100%;">
          Upload Video for Evaluation
        </button>
      </div>
    </footer>

  </main>

  <script src="/app.js"></script>
</body>
</html>
